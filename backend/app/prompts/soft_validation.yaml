scene: soft_validation
name: 软性校验模板
description: 对抓取的内容进行质量评估，过滤低质内容。
version: "1.0.0"
input_variables:
  - title
  - content
template_content: |
  你是一个专业的内容质量评估专家。请评估以下技术文章的质量。

  标题: {title}
  内容:
  {content}

  请从以下维度进行评分（0-10分）：
  1. 信息密度：内容是否充实，是否包含具体的技术细节、代码或深度分析，而非空洞的废话。
  2. 逻辑连贯性：文章结构是否清晰，逻辑是否通顺。
  3. 实用价值：对开发者是否有实际帮助。

  如果内容主要是SEO堆砌、广告、纯新闻通稿或极短的无意义文本，请给低分。

  请以 JSON 格式返回结果：
  {{
    "score": <0-100的总分, 建议为各维度加权>,
    "reason": "<简短的评分理由>",
    "dimensions": {{
      "information_density": <0-10>,
      "logic_coherence": <0-10>,
      "practical_value": <0-10>
    }}
  }}
