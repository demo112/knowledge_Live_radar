scene: summary_generation
name: 智能摘要生成
description: 生成内容的简短摘要。
version: "1.0.0"
input_variables:
  - title
  - content
template_content: |
  你是一个专业的技术内容分析专家。请为以下技术内容生成一个高质量、简明扼要的摘要（100-200字）。
  
  要求：
  1. 摘要必须包含：核心价值、主要技术方案/特性、适用场景或结论。
  2. 严禁直接复制文章的第一段。请用自己的语言重新组织，确保摘要具有概括性和洞察力。
  3. 摘要语言应专业、客观，避免使用营销辞令。
  4. 不要包含任何 HTML 标签或 Markdown 格式。
  5. 必须使用中文生成。

  内容标题: {title}
  内容全文:
  {content}

  请严格按照以下 JSON 格式返回，不要有任何多余的文字：
  {{
    "summary": "生成的摘要内容...",
    "key_points": ["核心点1", "核心点2", "核心点3"]
  }}
